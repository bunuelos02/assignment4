<div class="container mt-4">
  <h3>Add Expense</h3>

  <input class="form-control mb-2" [(ngModel)]="title" placeholder="Title">

  <input class="form-control mb-2" type="number"
         [(ngModel)]="amount" placeholder="Amount">

  <select class="form-control mb-2" [(ngModel)]="category">
    @for (cat of service.categories(); track cat) {
      <option [value]="cat">{{ cat }}</option>
    }
  </select>

  <button class="btn btn-primary" (click)="add()">Add</button>
</div>
